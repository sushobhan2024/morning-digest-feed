name: Update RSS Feed

on:
  schedule:
    - cron: "30 14 * * *" 
  workflow_dispatch: {}   # allows manual runs from the Actions tab

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install beautifulsoup4 feedgen

      - name: Generate feed
        env:
          IMAP_HOST: ${{ secrets.IMAP_HOST }}
          IMAP_USER: ${{ secrets.IMAP_USER }}
          IMAP_PASS: ${{ secrets.IMAP_PASS }}
          SENDER_FILTER: ${{ secrets.SENDER_FILTER }}
          FEED_SITE_URL: ${{ vars.FEED_SITE_URL }}
        run: python scripts/generate_feed.py

      - name: Commit updated feed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/feed.xml
          git diff --quiet && git diff --staged --quiet || git commit -m "Update RSS feed"
          git pull --rebase origin main
          git push
